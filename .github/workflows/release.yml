name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-universal:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Create universal GS sidecar
        run: |
          lipo -create -output src-tauri/binaries/gs-universal-apple-darwin \
            src-tauri/binaries/gs-aarch64-apple-darwin \
            src-tauri/binaries/gs-x86_64-apple-darwin
          chmod +x src-tauri/binaries/gs-universal-apple-darwin

      - name: Build universal app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Rename DMG to bracket-free filename
        id: dmg
        run: |
          SRC=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: No DMG file found after build"
            exit 1
          fi
          DEST="compress-pdf_${{ github.ref_name }}_universal.dmg"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "DMG: $DEST"

      - name: Create draft GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            "${{ steps.dmg.outputs.path }}"
        env:
          GH_TOKEN: ${{ github.token }}
